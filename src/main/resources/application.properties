# Spring Boot & Actuator Configuration
# The admin API sends HTTP Basic credentials on every request. Bind it to
# loopback by default and terminate TLS in a proxy before setting SERVER_ADDRESS.
server.address=${SERVER_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=prometheus,health,info
management.endpoint.prometheus.access=read-only
management.endpoint.health.probes.enabled=true
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.prometheus=metrics
management.endpoints.web.path-mapping.health=healthz

# NETWORKING CONFIGURATION
controllers.bind-addresses=0.0.0.0,::
controllers.connect.port=27888
controllers.connect.buffer-size=1024
controllers.v086.port-range-start=27889
controllers.v086.extra-ports=10
# Data-socket pool size. 0 derives it from server.max-users + max-connecting +
# extra-ports + 1. The pool bounds concurrent sessions even when max-users=0.
controllers.v086.max-sessions=0
controllers.v086.buffer-size=2048
controllers.v086.client-types=0.83

# GAME PERFORMANCE CONFIGURATION
game.buffer-size=1024
game.timeout-millis=1250
game.desynch-timeouts=4
game.default-auto-fire-sensitivity=0

# MASTER LIST CONFIGURATION
master-list.server-name=New Kaillux Server
master-list.server-location=Unknown
master-list.server-website=https://github.com/kidoz/kaillux
master-list.server-connect-address=
master-list.touch-kaillera=true
master-list.touch-emulinker=true
master-list.emulinker-master-url=http://master.emulinker.org/touch.php

# GENERAL SERVER CHECKS AND CONTROL CONFIGURATION
server.max-ping=250
server.allowed-connection-types=1,2,3,4,5,6
server.max-users=25
# Handshakes that have not logged in yet. They do not consume max-users slots.
# Keep max-connecting-per-address well below max-connecting: it is the share of
# the connecting slots that one address may hold, and HELLOs can carry a spoofed
# source address. A session that never starts logging in expires after a few
# seconds. hello-rate-per-second counts HELLO messages from one address.
# 0 disables a limit.
server.max-connecting=10
server.max-connecting-per-address=3
server.max-users-per-address=10
server.hello-rate-per-second=5
server.max-games=0
server.allow-single-player=true
server.allow-multiple-connections=true
server.keep-alive-timeout=190
server.idle-timeout=900

# FLOOD CONTROL AND HACKER PREVENTION CONFIGURATION
server.chat-flood-time=2
server.create-game-flood-time=2
server.join-game-flood-time=1
server.max-user-name-length=45
server.max-client-name-length=100
server.max-chat-length=150
server.max-game-name-length=100
server.max-quit-message-length=75

# ADMIN DASHBOARD CONFIGURATION
# Set ADMIN_PASSWORD (or admin.password) to a strong unique password. When no
# password is configured, a random password is generated and printed once to
# the process console. It is not written to the application log.
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:}
# In-game admin commands are authorised by UDP source address, which can be
# spoofed. An address becomes trusted after a successful dashboard login and
# stays trusted for this many seconds; loopback is always trusted. Set to 0 to
# require a fresh dashboard login for every command.
admin.in-game-admin-ttl-seconds=1800
# Optional comma-separated wildcard addresses (for example 10.0.0.*) that may
# use in-game admin without a dashboard login.
admin.trusted-in-game-addresses=
# Comma-separated reverse-proxy addresses allowed to assert X-Forwarded-For for
# login-failure limiting. Leave empty unless a proxy terminates the connection.
admin.security.trusted-proxies=

# RELAY MODE CONFIGURATION
# When enabled, the server acts as a transparent UDP relay/proxy to a backend Kaillera server.
# This allows clients behind NAT/firewalls to connect through the relay.
relay.enabled=false
relay.listen-port=27887
relay.bind-address=0.0.0.0
relay.backend-host=localhost
relay.backend-port=27888
relay.max-connections=100
relay.buffer-size=2048
# The backend may only assign data ports in this range, and the relay keeps at
# most this many spawned data relays.
relay.data-port-range-start=27889
relay.data-port-range-end=65535
relay.max-relay-ports=100

# OPENAPI/SWAGGER CONFIGURATION
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=list
