import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.Effort
import com.github.spotbugs.snom.SpotBugsTask

plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
    alias(libs.plugins.spotless)
    id 'checkstyle'
    alias(libs.plugins.spotbugs)
    id 'jacoco'
}

group = 'su.kidoz'
version = '1.4.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

configurations.configureEach {
    // Exclude commons-logging to use SLF4J bridge instead
    exclude group: 'commons-logging', module: 'commons-logging'
}

dependencies {
    implementation libs.spring.boot.starter.web
    implementation libs.spring.boot.starter.actuator
    implementation libs.spring.boot.starter.security
    implementation libs.spring.boot.starter.restclient
    implementation libs.micrometer.registry.prometheus

    // Validation support for @ConfigurationProperties
    implementation libs.spring.boot.starter.validation

    // OpenAPI/Swagger documentation
    implementation libs.springdoc.openapi.webmvc.ui

    // Logging: SLF4J + Logback (Spring Boot includes Logback by default)
    // Bridge for libraries that still use commons-logging API
    implementation libs.slf4j.jcl

    // Testing
    testImplementation libs.spring.boot.starter.test
    testImplementation libs.spring.security.test
    testRuntimeOnly libs.junit.platform.launcher

}

def adminUiDist = layout.projectDirectory.dir('src/main/resources/static/admin/dist')

tasks.named('processResources') {
    // The admin UI is built separately by npm/Vite. Its sources and tooling do
    // not belong in the server artifact, where they would be served publicly; the
    // built bundle is packaged at static/admin/ so /admin/index.html and
    // /admin/assets/* resolve.
    exclude 'static/admin/src/**'
    exclude 'static/admin/node_modules/**'
    exclude 'static/admin/package.json'
    exclude 'static/admin/package-lock.json'
    exclude 'static/admin/vite.config.ts'
    exclude 'static/admin/tsconfig.json'
    exclude 'static/admin/eslint.config.ts'
    exclude 'static/admin/prettier.config.ts'
    exclude 'static/admin/.prettierignore'
    exclude 'static/admin/.gitignore'
    exclude 'static/admin/index.html'
    exclude 'static/admin/dist/**'
    from(adminUiDist) {
        into 'static/admin'
    }
}

tasks.register('verifyAdminUi') {
    description = 'Verifies that the admin UI bundle exists before packaging or running.'
    doLast {
        if (!adminUiDist.asFile.isDirectory()) {
            throw new GradleException("Admin UI bundle not found at ${adminUiDist.asFile}. "
                    + "Run 'just admin-build' (or npm run build in the admin directory) first.")
        }
    }
}

tasks.named('bootJar') {
    dependsOn 'verifyAdminUi'
}

tasks.named('bootRun') {
    dependsOn 'verifyAdminUi'
}

tasks.named('test') {
    useJUnitPlatform {
        // Exclude load tests by default
        if (!System.getProperty('load.tests')?.equals('true')) {
            excludeTags 'load'
        }
    }
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
    // Gradle does not pass -D flags from the command line to test workers, so the
    // load-test knobs (load.*, kaillera.*) are forwarded here. Without this the
    // load tests skip or ignore their parameters.
    System.getProperties().findAll { it.key.startsWith('load.') || it.key.startsWith('kaillera.') }
            .each { systemProperty it.key, it.value }
}

spotless {
    java {
        target 'src/*/java/**/*.java'
        eclipse(libs.versions.eclipse.formatter.get()).configFile(rootProject.file('config/eclipse-formatter.xml'))
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

checkstyle {
    toolVersion = libs.versions.checkstyle.get()
    configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
    ignoreFailures = false
    maxWarnings = 0        // All checkstyle warnings have been fixed
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = false
        html.required = true
    }
}

spotbugs {
    toolVersion = libs.versions.spotbugs.tool.get()
    ignoreFailures = false
    effort.set(Effort.valueOf('MAX'))           // More thorough analysis
    reportLevel.set(Confidence.valueOf('MEDIUM'))  // Catch more real bugs
    excludeFilter = file("${rootDir}/config/spotbugs/exclude.xml")
}

tasks.withType(SpotBugsTask).configureEach {
    reports {
        xml.required = false
        html.required = true
    }
}

jar {
    enabled = false // Use bootJar for executable
}

bootJar {
    archiveFileName = 'kaillux.jar'
    destinationDirectory = file('build')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.debug = true
    options.compilerArgs << "-Werror"
    options.compilerArgs << "-Xlint:deprecation"
    options.compilerArgs << "-Xlint:unchecked"
}

jacoco {
    toolVersion = libs.versions.jacoco.get()
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

// Classes left out of coverage: protocol message classes are data carriers that
// the end-to-end protocol test exercises as a whole.
def coverageExcludes = [
    '**/protocol/**',
    '**/messaging/**',
    '**/EmuLinkerApplication.class',
]

// The report and the gate must measure the same classes, or the gate can pass on
// code the report never shows.
afterEvaluate {
    def coverageClasses = files(jacocoTestReport.classDirectories.files.collect {
        fileTree(dir: it, excludes: coverageExcludes)
    })
    jacocoTestReport.classDirectories.setFrom(coverageClasses)
    jacocoTestCoverageVerification.classDirectories.setFrom(coverageClasses)
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.40 // Increased from 25% - improved test coverage
            }
        }
    }
}

// The gate belongs to check: a report that nobody enforces lets coverage drop.
tasks.named('check') {
    dependsOn jacocoTestReport
    dependsOn jacocoTestCoverageVerification
}
