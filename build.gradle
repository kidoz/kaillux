import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.Effort
import com.github.spotbugs.snom.SpotBugsTask

plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
    alias(libs.plugins.spotless)
    id 'checkstyle'
    alias(libs.plugins.spotbugs)
    id 'jacoco'
}

group = 'su.kidoz'
version = '1.3.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

configurations.configureEach {
    // Exclude commons-logging to use SLF4J bridge instead
    exclude group: 'commons-logging', module: 'commons-logging'
}

dependencies {
    implementation libs.spring.boot.starter.web
    implementation libs.spring.boot.starter.actuator
    implementation libs.spring.boot.starter.security
    implementation libs.spring.boot.starter.restclient
    implementation libs.micrometer.registry.prometheus

    // Validation support for @ConfigurationProperties
    implementation libs.spring.boot.starter.validation

    // OpenAPI/Swagger documentation
    implementation libs.springdoc.openapi.webmvc.ui

    // Logging: SLF4J + Logback (Spring Boot includes Logback by default)
    // Bridge for libraries that still use commons-logging API
    implementation libs.slf4j.jcl

    // Testing
    testImplementation libs.spring.boot.starter.test
    testImplementation libs.spring.security.test
    testRuntimeOnly libs.junit.platform.launcher

}

tasks.named('test') {
    useJUnitPlatform {
        // Exclude load tests by default
        if (!System.getProperty('load.tests')?.equals('true')) {
            excludeTags 'load'
        }
    }
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
    // Pass system properties to tests
    systemProperty 'load.tests', System.getProperty('load.tests')
}

spotless {
    java {
        target 'src/*/java/**/*.java'
        eclipse(libs.versions.eclipse.formatter.get()).configFile(rootProject.file('config/eclipse-formatter.xml'))
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

checkstyle {
    toolVersion = libs.versions.checkstyle.get()
    configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
    ignoreFailures = false
    maxWarnings = 0        // All checkstyle warnings have been fixed
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = false
        html.required = true
    }
}

spotbugs {
    toolVersion = libs.versions.spotbugs.tool.get()
    ignoreFailures = false
    effort.set(Effort.valueOf('MAX'))           // More thorough analysis
    reportLevel.set(Confidence.valueOf('MEDIUM'))  // Catch more real bugs
    excludeFilter = file("${rootDir}/config/spotbugs/exclude.xml")
}

tasks.withType(SpotBugsTask).configureEach {
    reports {
        xml.required = false
        html.required = true
    }
}

jar {
    enabled = false // Use bootJar for executable
}

bootJar {
    archiveFileName = 'kaillux.jar'
    destinationDirectory = file('build')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.debug = true
    options.compilerArgs << "-Werror"
    options.compilerArgs << "-Xlint:deprecation"
    options.compilerArgs << "-Xlint:unchecked"
}

jacoco {
    toolVersion = libs.versions.jacoco.get()
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, excludes: [
                '**/protocol/**',  // Protocol message classes
                '**/messaging/**', // Messaging infrastructure
                '**/EmuLinkerApplication.class', // Main application
            ])
        }))
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.40 // Increased from 25% - improved test coverage
            }
        }
    }
}

tasks.named('check') {
    dependsOn jacocoTestReport
}
